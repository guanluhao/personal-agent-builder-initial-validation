[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-builder"
version = "0.1.0"
description = "Approval-gated Python project agent builder"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
test = ["pytest>=8"]

[project.scripts]
personal-agent-builder = "personal_agent_builder.cli:main"

[tool.setuptools]
packages = ["personal_agent_builder"]

[tool.setuptools.package-data]
personal_agent_builder = ["web/*.html", "web/*.css", "web/*.js"]
